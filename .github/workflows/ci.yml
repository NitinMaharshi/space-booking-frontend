name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL to run the Playwright e2e suite against instead of the local GHCR-image backend (leave empty for the default)'
        required: false
        type: string

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b --noEmit
      - run: npm run test
      - name: Production build
        env:
          VITE_API_URL: ${{ inputs.api_url || 'http://localhost:3000' }}
        run: npm run build

  # This repo doesn't have the backend's source, so a plain `push` job can't
  # build one. Instead it pulls the prod image the backend repo publishes to
  # GHCR on every merge to its main (see space-booking-backend's ci.yml
  # `publish` job) and runs the real API against a throwaway Postgres. A
  # manual workflow_dispatch run can still point at a different deployed
  # backend by supplying api_url, skipping the local container entirely.
  e2e:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking_ci_password
          POSTGRES_DB: booking_system_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_system_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_IMAGE: ghcr.io/nitinmaharshi/space-booking-backend:latest
      DATABASE_URL: postgresql://booking:booking_ci_password@localhost:5432/booking_system_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production-use-32chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production-use-32chars
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      THROTTLE_TTL: '60000'
      THROTTLE_LIMIT: '1000'
      AUTH_THROTTLE_TTL: '60000'
      AUTH_THROTTLE_LIMIT: '1000'
      PORT: '3000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start backend from GHCR image
        if: ${{ !inputs.api_url }}
        # NODE_ENV=production is scoped to this step only — job-level would
        # also poison the npm ci step above: npm treats an ambient
        # NODE_ENV=production as an implicit --omit=dev, and the `husky`
        # prepare script isn't a prod dependency.
        env:
          NODE_ENV: production
        run: |
          docker pull "$BACKEND_IMAGE"
          docker run --rm --network host -e DATABASE_URL "$BACKEND_IMAGE" npx prisma migrate deploy
          docker run --rm --network host -e DATABASE_URL "$BACKEND_IMAGE" npx prisma db seed
          docker run -d --network host --name backend \
            -e DATABASE_URL -e REDIS_URL -e JWT_ACCESS_SECRET -e JWT_ACCESS_EXPIRES_IN \
            -e JWT_REFRESH_SECRET -e JWT_REFRESH_EXPIRES_IN -e CORS_ORIGIN \
            -e THROTTLE_TTL -e THROTTLE_LIMIT -e AUTH_THROTTLE_TTL -e AUTH_THROTTLE_LIMIT \
            -e NODE_ENV -e PORT \
            "$BACKEND_IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "Backend never became healthy" >&2
          exit 1

      - name: E2E tests against ${{ inputs.api_url || 'the GHCR-published backend' }}
        env:
          CI: 'true'
          VITE_API_URL: ${{ inputs.api_url || 'http://localhost:3000' }}
        run: npm run test:e2e

      - name: Backend container logs
        if: ${{ always() && !inputs.api_url }}
        run: docker logs backend || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
